repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/psf/black
    rev: 23.1.0
    hooks:
      - id: black
        name: black-python
        entry: black
        language: python
        types: [python]
        args: [--line-length=120]
      - id: black
        name: black-ipynb
        entry: black
        language: python
        types: [jupyter]
        args: [--line-length=110, --ipynb]
        files: \.ipynb$

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
